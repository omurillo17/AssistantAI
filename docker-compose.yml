services:
  postgres:
    image: postgres:16-alpine
    restart: always
    networks:
      - virgo_network
    environment:
      - POSTGRES_DB=${DB_POSTGRESDB_DATABASE}
      - POSTGRES_USER=${DB_POSTGRESDB_USER}
      - POSTGRES_PASSWORD=${DB_POSTGRESDB_PASSWORD}
    volumes:
      - postgres_data_final:/var/lib/postgresql/data
      - ./virgo_data/scripts/database_setup.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      # Solo loopback: Postgres no debe ser accesible desde fuera del host.
      # Con "5433:5432" Docker publica en 0.0.0.0 y, en un servidor con IP
      # pública, la base queda expuesta a internet (y Docker abre el puerto
      # saltándose las reglas de UFW/firewall del sistema).
      # El acceso local (psql, authorize_recruiter.py) sigue funcionando igual.
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -h localhost -U ${DB_POSTGRESDB_USER} -d ${DB_POSTGRESDB_DATABASE}" ]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: always
    networks:
      - virgo_network
    ports:
      # Loopback: WAHA y el frontend llegan al backend por la red interna de
      # Docker (`backend:8000`), no por el puerto publicado. Este binding es
      # solo para depurar desde el propio host.
      - "127.0.0.1:8000:8000"
    environment:
      - DATABASE_URL=postgresql://${DB_POSTGRESDB_USER}:${DB_POSTGRESDB_PASSWORD}@postgres:5432/${DB_POSTGRESDB_DATABASE}
      - GOOGLE_TOKEN_ENCRYPTION_KEY=${GOOGLE_TOKEN_ENCRYPTION_KEY}
      - GOOGLE_OAUTH_CLIENT_ID=${GOOGLE_OAUTH_CLIENT_ID}
      - GOOGLE_OAUTH_CLIENT_SECRET=${GOOGLE_OAUTH_CLIENT_SECRET}
      - PYTHON_SERVICE_API_KEY=${PYTHON_SERVICE_API_KEY:-}
      - FRONTEND_API_BASE=${FRONTEND_API_BASE:-http://host.docker.internal:3001}
      # Llave saliente hacia el frontend. N8N_API_KEY/WEBHOOK_API_KEY se siguen
      # pasando como respaldo mientras se termina de renombrar en los .env.
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:-}
      - N8N_API_KEY=${N8N_API_KEY:-}
      - WEBHOOK_API_KEY=${WEBHOOK_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - WAHA_API_KEY=${WAHA_API_KEY}
      - WAHA_BASE_URL=${WAHA_BASE_URL:-http://waha:3000}
      # WhatsApp del ROOT: recibe copia de las alertas de fallo del agente.
      - ALERTAS_ADMIN_TELEFONO=${ALERTAS_ADMIN_TELEFONO:-}
      # Ritmo de salida de WhatsApp: evita el baneo por responder en ráfaga.
      - WAHA_SEGUNDOS_ENTRE_MENSAJES=${WAHA_SEGUNDOS_ENTRE_MENSAJES:-8}
      - WAHA_JITTER_SEGUNDOS=${WAHA_JITTER_SEGUNDOS:-7}
      - TZ=America/Mexico_City
    volumes:
      - ./virgo_data:/app/virgo_files
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy

  waha:
    image: devlikeapro/waha:latest
    restart: always
    networks:
      - virgo_network
    ports:
      # Loopback: la sesión de WhatsApp vive aquí. Expuesto en 0.0.0.0
      # cualquiera con la IP del servidor puede llegar al panel de WAHA e
      # intentar secuestrar la sesión. El backend lo alcanza por la red
      # interna (`waha:3000`); para abrir el dashboard desde otra máquina,
      # usa un túnel SSH en vez de publicar el puerto.
      - "127.0.0.1:3000:3000"
    environment:
      - WHATSAPP_DEFAULT_ENGINE=WEBJS
      # Entrega los mensajes de WhatsApp al backend Python (routers/whatsapp.py).
      # Ojo: WAHA guarda el webhook en la config de cada sesión; esta variable
      # solo aplica a sesiones nuevas. Si se cambia, hay que actualizar también
      # la sesión viva vía PUT /api/sessions/default.
      - WAHA_WEBHOOK_URL=http://backend:8000/webhook/messages
      - WAHA_API_KEY=${WAHA_API_KEY}
      # Sin valores por defecto: deben definirse en .env (nunca admin/admin).
      - WAHA_DASHBOARD_USERNAME=${WAHA_DASHBOARD_USERNAME}
      - WAHA_DASHBOARD_PASSWORD=${WAHA_DASHBOARD_PASSWORD}
      - WAHA_PRINT_QR=True
      - WHATSAPP_DOWNLOAD_MEDIA=true
      - WHATSAPP_MEDIA_STORAGE=local
      - WAHA_BASE_URL=http://waha:3000
      - WHATSAPP_FILES_FOLDER=/app/.waha/files
      - WHATSAPP_DOWNLOAD_MEDIA_INSTANT=true
      - WHATSAPP_WEBHOOK_MEDIA=true
      - WHATSAPP_FILES_LIFETIME=0
    volumes:
      - waha_data_final:/app/.waha
      - waha_files_final:/app/.waha/files
    depends_on:
      - backend
      - postgres

networks:
  virgo_network:
    driver: bridge

volumes:
  postgres_data_final:
  waha_data_final:
  waha_files_final:
