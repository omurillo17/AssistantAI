services:
  postgres:
    image: postgres:16-alpine
    restart: always
    networks:
      - virgo_network
    environment:
      - POSTGRES_DB=${DB_POSTGRESDB_DATABASE}
      - POSTGRES_USER=${DB_POSTGRESDB_USER}
      - POSTGRES_PASSWORD=${DB_POSTGRESDB_PASSWORD}
    volumes:
      - postgres_data_final:/var/lib/postgresql/data
      - ./virgo_data/scripts/database_setup.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5433:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -h localhost -U ${DB_POSTGRESDB_USER} -d ${DB_POSTGRESDB_DATABASE}" ]
      interval: 5s
      timeout: 5s
      retries: 10

  n8n:
    image: n8nio/n8n:latest
    restart: always
    networks:
      - virgo_network
    ports:
      - "5678:5678"
    environment:
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${DB_POSTGRESDB_DATABASE}
      - DB_POSTGRESDB_USER=${DB_POSTGRESDB_USER}
      - DB_POSTGRESDB_PASSWORD=${DB_POSTGRESDB_PASSWORD}
      - N8N_HOST=localhost
      - WEBHOOK_URL=${WEBHOOK_URL}
      - GENERIC_TIMEZONE=America/Mexico_City
      - TZ=America/Mexico_City
      - NODE_FUNCTION_ALLOW_BUILTIN=fs,path,module,child_process
      - NODE_FUNCTION_ALLOW_EXTERNAL=*
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - TCI_API_BASE=${TCI_API_BASE:-http://host.docker.internal:3001}
      - TCI_EMPRESA_ID=${TCI_EMPRESA_ID:-}
      - N8N_API_KEY=${N8N_API_KEY:-}
      - BACKEND_API_BASE=${BACKEND_API_BASE:-http://backend:8000}
      - PYTHON_SERVICE_API_KEY=${PYTHON_SERVICE_API_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - n8n_data_final:/home/node/.n8n
      - ./virgo_data:/home/node/virgo_files
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: ./backend
    restart: always
    networks:
      - virgo_network
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://${DB_POSTGRESDB_USER}:${DB_POSTGRESDB_PASSWORD}@postgres:5432/${DB_POSTGRESDB_DATABASE}
      - GOOGLE_TOKEN_ENCRYPTION_KEY=${GOOGLE_TOKEN_ENCRYPTION_KEY}
      - GOOGLE_OAUTH_CLIENT_ID=${GOOGLE_OAUTH_CLIENT_ID}
      - GOOGLE_OAUTH_CLIENT_SECRET=${GOOGLE_OAUTH_CLIENT_SECRET}
      - PYTHON_SERVICE_API_KEY=${PYTHON_SERVICE_API_KEY:-}
      - FRONTEND_API_BASE=${FRONTEND_API_BASE:-http://host.docker.internal:3001}
      - N8N_API_KEY=${N8N_API_KEY:-}
      - TZ=America/Mexico_City
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy

  waha:
    image: devlikeapro/waha:latest
    restart: always
    networks:
      - virgo_network
    ports:
      - "3000:3000"
    environment:
      - WHATSAPP_DEFAULT_ENGINE=WEBJS
      - WAHA_WEBHOOK_URL=http://n8n:5678/webhook/messages
      - WAHA_API_KEY=${WAHA_API_KEY}
      # Sin valores por defecto: deben definirse en .env (nunca admin/admin).
      - WAHA_DASHBOARD_USERNAME=${WAHA_DASHBOARD_USERNAME}
      - WAHA_DASHBOARD_PASSWORD=${WAHA_DASHBOARD_PASSWORD}
      - WAHA_PRINT_QR=True
      - WHATSAPP_DOWNLOAD_MEDIA=true
      - WHATSAPP_MEDIA_STORAGE=local
      - WAHA_BASE_URL=http://waha:3000
      - WHATSAPP_FILES_FOLDER=/app/.waha/files
      - WHATSAPP_DOWNLOAD_MEDIA_INSTANT=true
      - WHATSAPP_WEBHOOK_MEDIA=true
      - WHATSAPP_FILES_LIFETIME=0
    volumes:
      - waha_data_final:/app/.waha
      - waha_files_final:/app/.waha/files
    depends_on:
      - n8n
      - postgres

networks:
  virgo_network:
    driver: bridge

volumes:
  postgres_data_final:
  n8n_data_final:
  waha_data_final:
  waha_files_final:
