# Techo de memoria por servicio (mem_limit). Los valores salen del pico real
# medido en cada contenedor (cgroup memory.peak) con holgura de ~2,5x:
#   postgres 166M · backend 130M · waha 761M · frontend 414M · cloudflared 63M
# La CPU no se limita a propósito: el host tiene 28 nucleos y ninguno de estos
# servicios compite por ellos. El fallo que sí puede tumbar la máquina entera es
# una fuga de memoria -- WAHA arrastra un Chromium -- y para eso está el límite.
services:
  postgres:
    image: postgres:16-alpine
    restart: always
    mem_limit: 1g
    security_opt: [no-new-privileges:true]
    networks:
      - internal
    environment:
      - POSTGRES_DB=${DB_POSTGRESDB_DATABASE}
      - POSTGRES_USER=${DB_POSTGRESDB_USER}
      - POSTGRES_PASSWORD=${DB_POSTGRESDB_PASSWORD}
    volumes:
      - postgres_data_final:/var/lib/postgresql/data
      - ./virgo_data/scripts/database_setup.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      # Solo loopback: Postgres no debe ser accesible desde fuera del host.
      # Con "5433:5432" Docker publica en 0.0.0.0 y, en un servidor con IP
      # pública, la base queda expuesta a internet (y Docker abre el puerto
      # saltándose las reglas de UFW/firewall del sistema).
      # El acceso local (psql, authorize_recruiter.py) sigue funcionando igual.
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -h localhost -U ${DB_POSTGRESDB_USER} -d ${DB_POSTGRESDB_DATABASE}" ]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: always
    mem_limit: 512m
    security_opt: [no-new-privileges:true]
    networks:
      - internal
    ports:
      # Loopback: WAHA y el frontend llegan al backend por la red interna de
      # Docker (`backend:8000`), no por el puerto publicado. Este binding es
      # solo para depurar desde el propio host.
      # Nota: el host usa 8002 porque 8000 está ocupado por marbete-backend.
      - "127.0.0.1:8002:8000"
    environment:
      # Rol de la app con solo DML (scripts/crear_rol_app.sh). Mientras no
      # exista APP_DB_USER/APP_DB_PASSWORD en .env se usa el superusuario.
      - DATABASE_URL=postgresql://${APP_DB_USER:-${DB_POSTGRESDB_USER}}:${APP_DB_PASSWORD:-${DB_POSTGRESDB_PASSWORD}}@postgres:5432/${DB_POSTGRESDB_DATABASE}
      - GOOGLE_TOKEN_ENCRYPTION_KEY=${GOOGLE_TOKEN_ENCRYPTION_KEY}
      - GOOGLE_OAUTH_CLIENT_ID=${GOOGLE_OAUTH_CLIENT_ID}
      - GOOGLE_OAUTH_CLIENT_SECRET=${GOOGLE_OAUTH_CLIENT_SECRET}
      - PYTHON_SERVICE_API_KEY=${PYTHON_SERVICE_API_KEY:-}
      - FRONTEND_API_BASE=${FRONTEND_API_BASE:-http://frontend:3001}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - WAHA_API_KEY=${WAHA_API_KEY}
      - WAHA_BASE_URL=${WAHA_BASE_URL:-http://waha:3000}
      # WhatsApp del ROOT: recibe copia de las alertas de fallo del agente.
      - ALERTAS_ADMIN_TELEFONO=${ALERTAS_ADMIN_TELEFONO:-}
      - TEST_DEV_PHONE=${TEST_DEV_PHONE:-}
      # Comandos de prueba por WhatsApp (solo desde TEST_DEV_PHONE). Apagados.
      - ENABLE_TEST_COMMANDS=${ENABLE_TEST_COMMANDS:-false}
      # HMAC con el que WAHA firma sus webhooks (X-Webhook-Hmac). Mismo valor
      # en el servicio waha (ver PRODUCCION.md: la sesión viva se actualiza aparte).
      - WAHA_WEBHOOK_HMAC_KEY=${WAHA_WEBHOOK_HMAC_KEY:-}
      # Meta Cloud API (WhatsApp Business Platform Oficial)
      - WHATSAPP_PROVIDER=${WHATSAPP_PROVIDER:-waha}
      - META_WA_ACCESS_TOKEN=${META_WA_ACCESS_TOKEN:-}
      - META_WA_PHONE_NUMBER_ID=${META_WA_PHONE_NUMBER_ID:-}
      - META_WA_WABA_ID=${META_WA_WABA_ID:-}
      # Sin valor por defecto: un token publicado en el repo no verifica nada.
      - META_WA_VERIFY_TOKEN=${META_WA_VERIFY_TOKEN:-}
      # Ritmo de salida de WhatsApp: evita el baneo por responder en ráfaga.
      - WAHA_SEGUNDOS_ENTRE_MENSAJES=${WAHA_SEGUNDOS_ENTRE_MENSAJES:-8}
      - WAHA_JITTER_SEGUNDOS=${WAHA_JITTER_SEGUNDOS:-7}
      - TZ=America/Mexico_City
    volumes:
      - ./virgo_data:/app/virgo_files
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # python:3.12-slim no trae curl ni wget; urllib evita instalar nada extra.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=5).status == 200 else 1)\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy

  waha:
    image: devlikeapro/waha:latest
    restart: always
    mem_limit: 2g
    security_opt: [no-new-privileges:true]
    networks:
      - internal
    ports:
      # Loopback: la sesión de WhatsApp vive aquí. Expuesto en 0.0.0.0
      # cualquiera con la IP del servidor puede llegar al panel de WAHA e
      # intentar secuestrar la sesión. El backend lo alcanza por la red
      # interna (`waha:3000`); para abrir el dashboard desde otra máquina,
      # usa un túnel SSH en vez de publicar el puerto.
      - "127.0.0.1:3000:3000"
    environment:
      - WHATSAPP_DEFAULT_ENGINE=NOWEB
      - WAHA_NOWEB_STORE_ENABLED=True
      - WAHA_NOWEB_STORE_FULL_SYNC=True
      # Entrega los mensajes de WhatsApp al backend Python (routers/whatsapp.py).
      # Ojo: WAHA guarda el webhook en la config de cada sesión; esta variable
      # solo aplica a sesiones nuevas. Si se cambia, hay que actualizar también
      # la sesión viva vía PUT /api/sessions/default.
      - WAHA_WEBHOOK_URL=http://backend:8000/webhook/messages
      - WAHA_WEBHOOK_HMAC_KEY=${WAHA_WEBHOOK_HMAC_KEY:-}
      - WAHA_API_KEY=${WAHA_API_KEY}
      # Sin valores por defecto: deben definirse en .env (nunca admin/admin).
      - WAHA_DASHBOARD_USERNAME=${WAHA_DASHBOARD_USERNAME}
      - WAHA_DASHBOARD_PASSWORD=${WAHA_DASHBOARD_PASSWORD}
      # El QR en los logs deja a quien los lea vincular su WhatsApp a la sesión.
      - WAHA_PRINT_QR=False
      - WHATSAPP_DOWNLOAD_MEDIA=true
      - WHATSAPP_MEDIA_STORAGE=local
      - WAHA_BASE_URL=http://waha:3000
      - WHATSAPP_FILES_FOLDER=/app/.waha/files
      - WHATSAPP_DOWNLOAD_MEDIA_INSTANT=true
      - WHATSAPP_WEBHOOK_MEDIA=true
      # Antes 0 (= para siempre): las fotos de INE/CV se acumulaban sin límite
      # en el volumen. El backend las descarga en minutos y guarda las que
      # importan en virgo_data/uploads; 7 días deja ver la multimedia reciente
      # en la bandeja de Mensajes, que la enlaza directo de WAHA.
      - WHATSAPP_FILES_LIFETIME=604800
    healthcheck:
      test: ["CMD-SHELL", "node -e 'fetch(\"http://localhost:3000/api/sessions/default\", {headers: {\"X-Api-Key\": process.env.WAHA_API_KEY}}).then(r => r.json()).then(d => process.exit(d.status === \"WORKING\" || d.status === \"SCAN_QR_CODE\" ? 0 : 1)).catch(() => process.exit(1))'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    volumes:
      - waha_data_final:/app/.waha
      - waha_files_final:/app/.waha/files
      # Credenciales de la sesión de WhatsApp (motor NOWEB: .sessions/noweb/
      # waha.sqlite3). NO están dentro de /app/.waha -- ese directorio solo
      # guarda los archivos multimedia. Sin este volumen la sesión vive en la
      # capa efímera del contenedor y `docker compose up --force-recreate` la
      # borra: WAHA arranca con "Session not found" y hay que volver a
      # escanear el QR (pasó el 24/08/2026).
      - waha_sessions_final:/app/.sessions
    depends_on:
      - backend
      - postgres

  frontend:
    build:
      context: ./frontend
    restart: always
    mem_limit: 1g
    security_opt: [no-new-privileges:true]
    # Único servicio en las dos redes: cloudflared (edge) solo llega a él.
    networks:
      - edge
      - internal
    ports:
      # Loopback: para depuración local. Cloudflared lo alcanza por la red
      # Docker interna (frontend:3001).
      - "127.0.0.1:3001:3001"
    environment:
      - NODE_ENV=production
      # Rol de la app con solo DML (scripts/crear_rol_app.sh). Mientras no
      # exista APP_DB_USER/APP_DB_PASSWORD en .env se usa el superusuario.
      - DATABASE_URL=postgresql://${APP_DB_USER:-${DB_POSTGRESDB_USER}}:${APP_DB_PASSWORD:-${DB_POSTGRESDB_PASSWORD}}@postgres:5432/${DB_POSTGRESDB_DATABASE}
      - JWT_SECRET=${JWT_SECRET}
      - WAHA_API_KEY=${WAHA_API_KEY}
      - WAHA_BASE_URL=http://waha:3000
      - WAHA_SESSION=${WAHA_SESSION:-default}
      - BACKEND_API_BASE=http://backend:8000
      - APP_PUBLIC_URL=${APP_PUBLIC_URL:-}
      - PYTHON_SERVICE_API_KEY=${PYTHON_SERVICE_API_KEY:-}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:-}
      - WHATSAPP_PROVIDER=${WHATSAPP_PROVIDER:-waha}
      - META_WA_ACCESS_TOKEN=${META_WA_ACCESS_TOKEN:-}
      - META_WA_PHONE_NUMBER_ID=${META_WA_PHONE_NUMBER_ID:-}
      - META_WA_WABA_ID=${META_WA_WABA_ID:-}
      - TZ=America/Mexico_City
    volumes:
      - ./virgo_data:/app/virgo_data
      - ./virgo_data:/app/virgo_files
      - ./virgo_data/uploads:/app/public/uploads
    # /api/health toca Postgres: si la base se cae, el contenedor pasa a
    # unhealthy en vez de seguir sirviendo páginas rotas en silencio.
    # wget viene en busybox (node:24-alpine), no hace falta instalar nada.
    # 127.0.0.1 y no "localhost": /etc/hosts del contenedor resuelve localhost
    # también a ::1, el wget de busybox intenta esa primero y next-server solo
    # escucha en IPv4 (0.0.0.0:3001), así que el chequeo fallaba siempre con
    # "Connection refused" y el contenedor quedaba unhealthy aun sirviendo bien.
    healthcheck:
      test: [ "CMD-SHELL", "wget -q --spider http://127.0.0.1:3001/api/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_healthy

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: always
    mem_limit: 256m
    security_opt: [no-new-privileges:true]
    # Solo `edge`: el túnel alcanza al frontend y a nada más. Si alguien se
    # hace con el token del túnel no puede apuntarlo a postgres, waha o backend.
    networks:
      - edge
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - frontend

# Dos redes: `edge` (cloudflared <-> frontend) e `internal` (el resto). No se
# marca `internal: true` porque backend (Gemini, Google) y waha (WhatsApp)
# necesitan salir a internet; lo que importa es que cloudflared no esté en ella.
networks:
  edge:
    driver: bridge
  internal:
    driver: bridge

volumes:
  postgres_data_final:
  waha_data_final:
  waha_files_final:
  waha_sessions_final:
