sonar.projectKey=AssistantAI
sonar.projectName=AssistantAI
sonar.projectVersion=1.0

# Código fuente
sonar.sources=backend/app,frontend/src

# Exclusiones
sonar.exclusions=**/node_modules/**,**/.next/**,**/dist/**,**/build/**,**/__pycache__/**,**/virgo_data/**,**/*.test.ts,**/*.test.tsx,**/tests/**,**/.claude/**
sonar.tests=backend/tests

# TypeScript
sonar.typescript.tsconfigPath=frontend/tsconfig.json

# Lenguajes y codificación
sonar.python.version=3.12
sonar.sourceEncoding=UTF-8

# Exclusión multicriterio para preservar integridad del bot de WhatsApp en producción
sonar.issue.ignore.multicriteria=e1,e2,e3
sonar.issue.ignore.multicriteria.e1.ruleKey=python:S3776
sonar.issue.ignore.multicriteria.e1.resourceKey=**/backend/app/chat/parser.py
sonar.issue.ignore.multicriteria.e2.ruleKey=python:S3776
sonar.issue.ignore.multicriteria.e2.resourceKey=**/backend/app/chat/analizador.py
sonar.issue.ignore.multicriteria.e3.ruleKey=python:S3776
sonar.issue.ignore.multicriteria.e3.resourceKey=**/backend/app/chat/ingesta.py

