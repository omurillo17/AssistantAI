name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

# Un push nuevo al mismo PR cancela la corrida anterior en vez de encolarla.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Misma versión que backend/Dockerfile, para que un fallo por
          # versión salga aquí y no en el rebuild de producción.
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Instalar dependencias
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Correr tests
        run: pytest -q

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Misma versión que frontend/Dockerfile.
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      # ESLint arrastra ~230 errores previos (casi todos no-explicit-any en
      # hooks y páginas grandes). Se reporta sin bloquear para que el CI sea
      # útil desde hoy; cuando la deuda llegue a cero, quitar el
      # continue-on-error para que empiece a bloquear de verdad.
      - name: Lint (informativo, no bloquea)
        run: npm run lint
        continue-on-error: true

      - name: Build
        run: npm run build
