name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

# Un push nuevo al mismo PR cancela la corrida anterior en vez de encolarla.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Misma versión que backend/Dockerfile, para que un fallo por
          # versión salga aquí y no en el rebuild de producción.
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Instalar dependencias
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Correr tests
        run: pytest -q

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Misma versión que frontend/Dockerfile.
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      # La deuda de eslint (los ~230 no-explicit-any de hooks y páginas
      # grandes) está saldada, así que el lint pasa a bloquear como pedía el
      # comentario que había aquí. Si vuelve a acumularse, la respuesta es
      # arreglarla, no devolver el continue-on-error.
      - name: Lint
        run: npm run lint

      # El build recolecta page data importando cada route module, y lib/db.ts
      # evalúa ENV.DATABASE_URL al importarse (no dentro de una función), así
      # que sin estas variables next build revienta en /api/db/mensajes/stream.
      # Son valores ficticios a propósito: el Pool de pg no abre conexión hasta
      # la primera query, y durante el build nunca se ejecuta ninguna.
      - name: Build
        run: npm run build
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          JWT_SECRET: ci-dummy-secret-para-build
          APP_PASSWORD: ci-dummy
          WAHA_API_KEY: ci-dummy
