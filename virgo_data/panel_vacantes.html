<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Vacantes TCi</title>
    <link rel="icon" type="image/png" href="data:image/png;base64,${imgBase64}">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-1: #3b82f6;
            --accent-2: #8b5cf6;
            --danger: #ef4444;
            --success: #10b981;
            --border-color: rgba(255, 255, 255, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* LOGIN SCREEN */
        #login-screen {
            position: fixed;
            inset: 0;
            background: var(--bg-color);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            flex-direction: column;
            gap: 20px;
        }

        .login-box {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            width: 90%;
            max-width: 400px;
        }

        .login-box h2 {
            margin-bottom: 20px;
        }

        .input-field {
            width: 100%;
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: rgba(0, 0, 0, 0.2);
            color: white;
            font-size: 16px;
            outline: none;
            margin-bottom: 15px;
            transition: all 0.3s ease;
        }

        .input-field:focus {
            border-color: var(--accent-1);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }

        .textarea-field {
            width: 100%;
            height: 120px;
            padding: 12px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border-color);
            color: white;
            border-radius: 8px;
            font-family: monospace;
            resize: vertical;
            margin-bottom: 15px;
        }

        /* HEADER */
        header {
            padding: 20px 40px;
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* BUTTONS */
        .btn {
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: all 0.2s ease;
            font-size: 14px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
            color: white;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(59, 130, 246, 0.4);
        }

        .btn-danger {
            background: var(--danger);
            color: white;
            padding: 6px 12px;
            font-size: 12px;
        }

        .btn-danger:hover {
            background: #dc2626;
        }

        .btn-edit {
            background: var(--success);
            color: white;
            padding: 6px 12px;
            font-size: 12px;
        }

        .btn-edit:hover {
            background: #059669;
        }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-main);
        }

        .btn-outline:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        /* DASHBOARD */
        .container {
            padding: 40px;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
            display: none;
            flex-grow: 1;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 16px;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: transform 0.3s ease;
        }

        .card:hover {
            border-color: rgba(255, 255, 255, 0.2);
        }

        .disabled-card {
            border-color: var(--danger);
        }

        .disabled-card .card-header {
            background: rgba(239, 68, 68, 0.1);
            color: var(--danger);
        }

        .card-header {
            padding: 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(0, 0, 0, 0.1);
        }

        .card-header h3 {
            font-size: 18px;
            font-weight: 600;
        }

        .emoji {
            font-size: 24px;
        }

        .naves-badges {
            display: flex;
            gap: 5px;
            margin-top: 5px;
        }

        .badge {
            background: rgba(59, 130, 246, 0.2);
            color: #93c5fd;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
        }

        .vacantes-list {
            padding: 20px;
            flex-grow: 1;
            min-height: 150px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .vacantes-list.drag-over {
            background: rgba(59, 130, 246, 0.05);
            border: 2px dashed var(--accent-1);
            border-radius: 8px;
        }

        .vacante-item {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            padding: 12px 15px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: grab;
            transition: all 0.2s;
        }

        .vacante-item:active {
            cursor: grabbing;
        }

        .vacante-item:hover {
            background: rgba(255, 255, 255, 0.06);
            transform: translateX(5px);
        }

        .vacante-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex-grow: 1;
        }

        .vacante-name {
            font-weight: 500;
            font-size: 14px;
        }

        .nave-indicator {
            font-size: 11px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .nave-indicator::before {
            content: '';
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--success);
        }

        .nave-2::before {
            background: var(--accent-2);
        }

        .nave-3::before {
            background: #f59e0b;
        }

        .actions {
            display: flex;
            gap: 5px;
        }

        .card-footer {
            padding: 15px 20px;
            border-top: 1px solid var(--border-color);
            background: rgba(0, 0, 0, 0.1);
        }

        /* MODAL */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            width: 90%;
            max-width: 500px;
            border: 1px solid var(--border-color);
            transform: translateY(20px);
            transition: transform 0.3s;
        }

        .modal-overlay.active .modal {
            transform: translateY(0);
        }

        .modal h3 {
            margin-bottom: 20px;
        }

        .modal-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
        }

        /* TOAST NOTIFICATION */
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: var(--success);
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 500;
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            z-index: 2000;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        .toast.error {
            background: var(--danger);
        }

        /* LOADER */
        .loader {
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top: 3px solid var(--accent-1);
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>

    <!-- LOGIN -->
    <div id="login-screen">
        <div class="login-box">
            <h2>Acceso a Reclutamiento</h2>
            <input type="password" id="pass-input" class="input-field" placeholder="Contraseña de acceso"
                onkeypress="if(event.key === 'Enter') checkLogin()">
            <button class="btn btn-primary" style="width: 100%;" onclick="checkLogin()">Entrar al Panel</button>
        </div>
    </div>

    <!-- MAIN APP -->
    <header id="app-header" style="display:none;">
        <div class="logo">TCi Reclutamiento</div>
        <div style="display:flex; gap: 15px; align-items:center;">
            <div id="save-loader" class="loader" style="display:none;"></div>
            <button class="btn btn-outline" onclick="loadData()">🔄 Recargar</button>
            <button class="btn btn-primary" onclick="saveData()">💾 Guardar Cambios</button>
        </div>
    </header>

    <div class="container" id="app-container">
        <div class="grid" id="recruiters-grid"></div>
    </div>

    <!-- ADD/EDIT VACANCY MODAL -->
    <div class="modal-overlay" id="add-modal">
        <div class="modal">
            <h3 id="modal-title">Agregar Vacante</h3>
            <input type="hidden" id="modal-recruiter-id">
            <input type="hidden" id="modal-vacancy-id">

            <label style="font-size:12px; color:var(--text-muted); margin-bottom:5px; display:block;">Nombre de la
                Vacante</label>
            <input type="text" id="modal-vacante-nombre" class="input-field" placeholder="EJ: OPERADOR GENERAL"
                style="text-transform: uppercase;">

            <label style="font-size:12px; color:var(--text-muted); margin-bottom:5px; display:block;">Nave / Sucursal
                (Selecciona una o varias)</label>
            <div id="modal-naves-checkboxes"
                style="margin-bottom: 15px; display: flex; gap: 15px; padding: 12px; background: rgba(0,0,0,0.2); border: 1px solid var(--border-color); border-radius: 8px;">
                <label style="display:flex; align-items:center; gap:5px; cursor:pointer;"><input type="checkbox"
                        value="1" class="nave-cb"> Nave 1</label>
                <label style="display:flex; align-items:center; gap:5px; cursor:pointer;"><input type="checkbox"
                        value="2" class="nave-cb"> Nave 2</label>
                <label style="display:flex; align-items:center; gap:5px; cursor:pointer;"><input type="checkbox"
                        value="3" class="nave-cb"> Nave 3</label>
            </div>

            <label style="font-size:12px; color:var(--text-muted); margin-bottom:5px; display:block;">Detalles (Sueldo,
                Horario, Requisitos)</label>
            <textarea id="modal-vacante-detalles" class="textarea-field" placeholder="-[REQUISITO EXCLUSIVO]
-*Prestaciones de ley*
-*$2,500 Semanales*..."></textarea>

            <div class="modal-buttons">
                <button class="btn btn-outline" onclick="closeModal()">Cancelar</button>
                <button class="btn btn-primary" onclick="confirmSaveVacancy()">Guardar</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast">✅ Cambios guardados con éxito</div>

    <script>
        const PASSWORD = "virgo";
        const API_URL = "/webhook/api-vacantes";

        let appData = [];
        let draggedItem = null;
        let draggedSourceIndex = null;

        function checkLogin() {
            const val = document.getElementById('pass-input').value;
            if (val === PASSWORD) {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('app-header').style.display = 'flex';
                document.getElementById('app-container').style.display = 'block';
                loadData();
            } else {
                alert("Contraseña incorrecta");
            }
        }

        async function loadData() {
            try {
                document.getElementById('recruiters-grid').innerHTML = '<div class="loader"></div>';
                const res = await fetch(API_URL);
                if (!res.ok) throw new Error();
                appData = await res.json();
                renderCards();
                showToast("Datos cargados", false);
            } catch (e) {
                showToast("Error al cargar datos de n8n.", true);
            }
        }

        async function saveData() {
            try {
                document.getElementById('save-loader').style.display = 'block';
                const res = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(appData)
                });
                if (!res.ok) throw new Error();
                showToast("✅ Cambios guardados en el servidor", false);
            } catch (e) {
                showToast("❌ Error al guardar", true);
            } finally {
                document.getElementById('save-loader').style.display = 'none';
            }
        }

        function renderCards() {
            const grid = document.getElementById('recruiters-grid');
            grid.innerHTML = '';

            // Garantizar que exista el contenedor de DESHABILITADAS
            if (!appData.find(r => r.nombre === "DESHABILITADAS")) {
                appData.push({ nombre: "DESHABILITADAS", emoji: "🚫", vacantes: [] });
            }

            appData.forEach((rec, recIndex) => {
                if (rec.nombre === "Gerente de Reclutamiento") return;

                const isDeshabilitadas = rec.nombre === "DESHABILITADAS";
                const navesTags = (rec.naves || []).map(n => `<span class="badge">Nave ${n}</span>`).join('');

                const card = document.createElement('div');
                card.className = isDeshabilitadas ? 'card disabled-card' : 'card';

                const addBtnHtml = isDeshabilitadas ? '' : `<button class="btn btn-outline" style="width:100%" onclick="openModal(${recIndex}, null)">+ Añadir Vacante</button>`;

                card.innerHTML = `
                    <div class="card-header">
                        <div class="emoji">${rec.emoji}</div>
                        <div>
                            <h3>${rec.nombre}</h3>
                            <div class="naves-badges">${navesTags}</div>
                        </div>
                    </div>
                    <div class="vacantes-list" data-rec-index="${recIndex}" ondragover="allowDrop(event)" ondrop="drop(event)" ondragenter="dragEnter(event)" ondragleave="dragLeave(event)">
                        ${renderVacantesList(rec.vacantes, recIndex)}
                    </div>
                    <div class="card-footer">
                        ${addBtnHtml}
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function renderVacantesList(vacantes, recIndex) {
            if (!vacantes || vacantes.length === 0) return `<div style="color:var(--text-muted); font-size:13px; text-align:center; padding: 20px 0;">Sin vacantes.</div>`;
            return vacantes.map((v, vIndex) => {
                // Migración on-the-fly para soportar array de naves en vez de string
                let navesArray = v.naves || (v.nave ? [v.nave] : []);
                let navesHtml = navesArray.map(n => `<div class="nave-indicator nave-${n}">Nave ${n}</div>`).join('');

                return `
                <div class="vacante-item" draggable="true" ondragstart="drag(event, ${recIndex}, ${vIndex})">
                    <div class="vacante-info">
                        <div class="vacante-name">${v.nombre}</div>
                        <div style="display:flex; gap:8px;">${navesHtml}</div>
                    </div>
                    <div class="actions">
                        <button class="btn btn-edit" onclick="openModal(${recIndex}, ${vIndex})">✏️</button>
                        <button class="btn btn-danger" onclick="deleteVacancy(${recIndex}, ${vIndex})">X</button>
                    </div>
                </div>
                `;
            }).join('');
        }

        function deleteVacancy(recIndex, vIndex) {
            if (confirm("¿Eliminar esta vacante?")) {
                appData[recIndex].vacantes.splice(vIndex, 1);
                renderCards();
            }
        }

        function openModal(recIndex, vIndex) {
            document.getElementById('modal-recruiter-id').value = recIndex;
            document.getElementById('modal-vacancy-id').value = vIndex !== null ? vIndex : "";

            // Limpiar checkboxes
            document.querySelectorAll('.nave-cb').forEach(cb => cb.checked = false);

            if (vIndex !== null) {
                document.getElementById('modal-title').textContent = "Editar Vacante";
                const v = appData[recIndex].vacantes[vIndex];
                document.getElementById('modal-vacante-nombre').value = v.nombre || "";
                document.getElementById('modal-vacante-detalles').value = v.detalles || "";

                let navesArray = v.naves || (v.nave ? [v.nave] : []);
                document.querySelectorAll('.nave-cb').forEach(cb => {
                    if (navesArray.includes(cb.value)) cb.checked = true;
                });
            } else {
                document.getElementById('modal-title').textContent = "Agregar Vacante";
                document.getElementById('modal-vacante-nombre').value = "";
                document.getElementById('modal-vacante-detalles').value = "";
                document.querySelector('.nave-cb[value="1"]').checked = true; // Por defecto
            }

            document.getElementById('add-modal').classList.add('active');
            document.getElementById('modal-vacante-nombre').focus();
        }

        function closeModal() { document.getElementById('add-modal').classList.remove('active'); }

        function confirmSaveVacancy() {
            const recIndex = document.getElementById('modal-recruiter-id').value;
            const vIndex = document.getElementById('modal-vacancy-id').value;
            const nombre = document.getElementById('modal-vacante-nombre').value.trim().toUpperCase();
            const detalles = document.getElementById('modal-vacante-detalles').value;

            const naves = Array.from(document.querySelectorAll('.nave-cb:checked')).map(cb => cb.value);

            if (!nombre) { alert("Escribe el nombre de la vacante"); return; }
            if (naves.length === 0) { alert("Selecciona al menos una nave"); return; }
            if (!appData[recIndex].vacantes) appData[recIndex].vacantes = [];

            if (vIndex === "") {
                appData[recIndex].vacantes.push({ naves, nombre, detalles });
            } else {
                const oldV = appData[recIndex].vacantes[vIndex];
                delete oldV.nave; // limpiar el campo viejo
                appData[recIndex].vacantes[vIndex] = { ...oldV, naves, nombre, detalles };
            }

            closeModal();
            renderCards();
        }

        function drag(ev, recIndex, vIndex) {
            draggedSourceIndex = recIndex;
            draggedItem = appData[recIndex].vacantes[vIndex];
            ev.dataTransfer.setData("vIndex", vIndex);
            ev.dataTransfer.effectAllowed = "move";
        }

        function allowDrop(ev) { ev.preventDefault(); }
        function dragEnter(ev) { ev.currentTarget.classList.add('drag-over'); }
        function dragLeave(ev) { ev.currentTarget.classList.remove('drag-over'); }

        function drop(ev) {
            ev.preventDefault();
            ev.currentTarget.classList.remove('drag-over');
            const targetRecIndex = ev.currentTarget.getAttribute('data-rec-index');
            const sourceVIndex = ev.dataTransfer.getData("vIndex");

            if (draggedSourceIndex == targetRecIndex) return;
            appData[draggedSourceIndex].vacantes.splice(sourceVIndex, 1);
            if (!appData[targetRecIndex].vacantes) appData[targetRecIndex].vacantes = [];
            appData[targetRecIndex].vacantes.push(draggedItem);
            draggedItem = null; draggedSourceIndex = null;
            renderCards();
        }

        function showToast(msg, isError) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.className = `toast show ${isError ? 'error' : ''}`;
            setTimeout(() => toast.classList.remove('show'), 3000);
        }
    </script>
</body>

</html>
